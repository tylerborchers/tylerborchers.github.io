    align-items:center;

    border-radius:16px;
    padding:24px 30px;
    text-decoration:none;

  .channel:active{ background-color:#f4f4f5; }
  .channel:hover{
    box-shadow: 0 18px 44px rgba(0,0,0,.13);
    border-color: rgba(17,17,17,.16);
  }

  .channel svg{ height:30px; width:auto; display:block; fill:currentColor; transition: color var(--reveal-ease); }

    .channel.s-x:hover{ color:#111111; }
    .channel.s-bs:hover{ color:#1185FE; }

  footer{

    border-top:1px solid var(--rule);
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:18px;

    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;

    border-bottom:1px solid transparent;

    transition: color .15s ease, border-color .15s ease;

  .footerLink:hover{ color:var(--text); border-bottom-color: rgba(17,17,17,.45); }

    gap:10px;
