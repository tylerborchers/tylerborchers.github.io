<style>
  :root{
    --bg:#fafafa;
    --card:#ffffff;
    --text:#111;
    --muted:#5f6368;
    --rule:#e6e6e6;
    --hoverShadow: 0 14px 34px rgba(0,0,0,.08);
    --reveal-ease: .3s ease;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .skip-link{
    position:absolute;
    left:-9999px;
    top:0;
    background:var(--text);
    color:#fff;
    padding:10px 16px;
    z-index:100;
    text-decoration:none;
    border-radius:0 0 8px 0;
  }
  .skip-link:focus{ left:0; }

  a:focus-visible{
    outline:2px solid var(--text);
    outline-offset:3px;
    border-radius:3px;
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    width:100%;
    padding:72px 40px 0;
  }
  .wrap--footer{
    padding:16px 40px 56px;
    margin-top:auto;
  }

  .backLink{
    display:inline-block;
    margin-bottom:22px;
    font-size:14px;
    color:var(--muted);
    text-decoration:none;
  }
  .backLink:hover{ color:var(--text); }

  h1{
    margin:0 0 18px;
    font-size:52px;
    line-height:1.02;
    letter-spacing:-0.02em;
  }

  .lede{
    font-size:18px;
    line-height:1.65;
    max-width:620px;
    margin:0 0 20px;
    color:var(--text);
  }

  .channels{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    margin:34px 0 8px;
  }

  .channel{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:16px;
    padding:24px 30px;
    text-decoration:none;
    box-shadow:0 10px 28px rgba(0,0,0,.06);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    will-change: transform;
  }
  .channel:hover{
    transform: translateY(-2px);
    box-shadow: var(--hoverShadow);
    border-color: rgba(17,17,17,.14);
  }

  .channel img{
    height:30px;
    width:auto;
    display:block;
    filter: grayscale(100%);
    -webkit-filter: grayscale(100%);
    opacity:.6;
    transition: filter var(--reveal-ease), opacity var(--reveal-ease);
  }
  .channel:hover img,
  .channel:focus-visible img{
    filter: grayscale(0);
    -webkit-filter: grayscale(0);
    opacity:1;
  }

  footer{
    padding-top:18px;
    border-top:1px solid var(--rule);
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:18px;
  }

  .socialText{
    justify-self:start;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    font-size:14px;
  }

  .footerLink{
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:1px;
    transition: color .15s ease, border-color .15s ease;
  }
  .footerLink:hover{ color:var(--text); border-bottom-color: rgba(17,17,17,.45); }

  .dot{ color: rgba(95,99,104,.7); }

  .navCenter{
    justify-self:center;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .copyright{ justify-self:end; font-size:14px; color:var(--muted); }

  /* Footer social icons (grayscale -> brand color) */
  .socialText{ gap:16px; }
  .socialIcon{ display:inline-flex; align-items:center; }
  .socialIcon img{ height:18px; width:auto; display:block;
    filter:grayscale(100%); -webkit-filter:grayscale(100%); opacity:.6;
    transition: filter var(--reveal-ease), opacity var(--reveal-ease); }
  .socialIcon:hover img, .socialIcon:focus-visible img{ filter:none; -webkit-filter:none; opacity:1; }
  .vh{ position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
  .navCenter .footerLink{ color:var(--text); }

  @media (max-width: 980px){
    .wrap{ padding:56px 28px 0; }
    .wrap--footer{ padding:14px 28px 48px; }
    h1{ font-size:44px; }
    footer{ grid-template-columns: 1fr; justify-items:start; gap:10px; }
    .navCenter{ justify-self:start; }
    .copyright{ justify-self:start; }
  }

  @media (hover: none){
    .socialIcon img, .channel img{ filter:none !important; -webkit-filter:none !important; opacity:1 !important; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <main class="wrap" id="main-content">
    <a class="backLink" href="/">&larr; Tyler Borchers</a>
    <h1>Contact</h1>
    <p class="lede">You can reach me by direct message on any of the platforms below.</p>
    <p class="lede">I take on select advisory work helping product, audience and revenue teams get more from AI. Tell me what you&rsquo;re building.</p>

    <div class="channels">
      <a class="channel" href="https://www.linkedin.com/in/tylerborchers/" target="_blank" rel="noopener" aria-label="Message Tyler on LinkedIn">
        <img src="/images/linkedin-icon.svg" alt="" width="30" height="30" />
      </a>

      <a class="channel" href="https://x.com/tylerborchers" target="_blank" rel="noopener" aria-label="Message Tyler on X">
        <img src="/images/x-icon.svg" alt="" width="30" height="30" />
      </a>

      <a class="channel" href="https://bsky.app/profile/tylerborchers.com" target="_blank" rel="noopener" aria-label="Message Tyler on Bluesky">
        <img src="/images/bluesky-icon.svg" alt="" width="30" height="30" />
      </a>
    </div>
  </main>

  <div class="wrap wrap--footer">
    <footer>
      <div class="socialText">
        <a class="socialIcon" href="https://www.linkedin.com/in/tylerborchers/" target="_blank" rel="noopener"><img src="/images/linkedin-icon.svg" alt="" width="18" height="18"><span class="vh">LinkedIn</span></a>
        <a class="socialIcon" href="https://x.com/tylerborchers" target="_blank" rel="noopener"><img src="/images/x-icon.svg" alt="" width="18" height="18"><span class="vh">X</span></a>
        <a class="socialIcon" href="https://bsky.app/profile/tylerborchers.com" target="_blank" rel="noopener"><img src="/images/bluesky-icon.svg" alt="" width="18" height="18"><span class="vh">Bluesky</span></a>
      </div>

      <nav class="navCenter" aria-label="Site pages">
        <a class="footerLink" href="/">Home</a>
        <span class="dot" aria-hidden="true">·</span>
        <a class="footerLink" href="/recognition/">Recognition</a>
      </nav>

      <div class="copyright">&copy; 2026 Tyler Borchers</div>
    </footer>
  </div>
</body>
</html>
