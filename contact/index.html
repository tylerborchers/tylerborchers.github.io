<style>
  :root{
    --bg:#fafafa;
    --card:#ffffff;
    --text:#111;
    --muted:#5f6368;
    --rule:#e6e6e6;
    --hoverShadow: 0 14px 34px rgba(0,0,0,.08);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    width:100%;
    padding:72px 40px 0;
  }
  .wrap--footer{
    padding:16px 40px 56px;
    margin-top:auto;
  }

  .backLink{
    display:inline-block;
    margin-bottom:22px;
    font-size:14px;
    color:var(--muted);
    text-decoration:none;
  }
  .backLink:hover{ color:var(--text); }

  h1{
    margin:0 0 18px;
    font-size:52px;
    line-height:1.02;
    letter-spacing:-0.02em;
  }

  .lede{
    font-size:18px;
    line-height:1.65;
    max-width:620px;
    margin:0 0 20px;
    color:var(--text);
  }

  .channels{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    margin:34px 0 8px;
  }

  .channel{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:16px;
    padding:24px 30px;
    text-decoration:none;
    box-shadow:0 10px 28px rgba(0,0,0,.06);
    transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    will-change: transform;
  }
  .channel:hover{
    transform: translateY(-1px);
    box-shadow: var(--hoverShadow);
    border-color: rgba(17,17,17,.14);
  }

  .channel svg{
    width:28px;
    height:28px;
    display:block;
    fill: var(--muted);
    transition: fill .15s ease;
  }
  .channel:hover svg{ fill: var(--text); }

  footer{
    padding-top:18px;
    border-top:1px solid var(--rule);
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:18px;
  }

  .socialText{
    justify-self:start;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    font-size:14px;
  }

  .footerLink{
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:1px;
    transition: color .15s ease, border-color .15s ease;
  }
  .footerLink:hover{ color:var(--text); border-bottom-color: rgba(17,17,17,.45); }

  .dot{ color: rgba(95,99,104,.7); }

  .navCenter{
    justify-self:center;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .copyright{ justify-self:end; font-size:14px; color:var(--muted); }

  @media (max-width: 980px){
    .wrap{ padding:56px 28px 0; }
    .wrap--footer{ padding:14px 28px 48px; }
    h1{ font-size:44px; }
    footer{ grid-template-columns: 1fr; justify-items:start; gap:10px; }
    .navCenter{ justify-self:start; }
    .copyright{ justify-self:start; }
  }

  @media (prefers-reduced-motion: reduce){
    .channel{ transition:none; }
    .channel:hover{ transform:none; }
  }
</style>
