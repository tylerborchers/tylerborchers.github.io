<style>
  :root{
    --bg:#fafafa;
    --card:#ffffff;
    --text:#111;
    --muted:#5f6368;
    --rule:#e6e6e6;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .wrap{
    max-width:1100px;
    margin:0 auto;
    width:100%;
    padding:72px 40px 0;
  }
  .wrap--footer{
    padding:16px 40px 56px;
    margin-top:auto;
  }

  .pageHead{
    margin-bottom:40px;
  }

  h1{
    margin:0 0 14px;
    font-size:44px;
    line-height:1.05;
    letter-spacing:-0.02em;
  }

  .backLink{
    display:inline-block;
    margin-bottom:28px;
    font-size:14px;
    color:var(--muted);
    text-decoration:none;
  }
  .backLink:hover{ color:var(--text); }

  .lede{
    font-size:18px;
    line-height:1.65;
    max-width:680px;
    color:var(--text);
  }

  .placeholder{
    margin-top:36px;
    padding:22px 24px;
    border:1px dashed var(--rule);
    border-radius:12px;
    color:var(--muted);
    font-size:15px;
    line-height:1.6;
    max-width:680px;
  }

  footer{
    padding-top:18px;
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:18px;
  }

  .socialText{
    justify-self:start;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    font-size:14px;
  }

  .footerLink{
    color:var(--muted);
    text-decoration:none;
    border-bottom:1px solid transparent;
    padding-bottom:1px;
    transition: color .15s ease, border-color .15s ease;
  }
  .footerLink:hover{
    color:var(--text);
    border-bottom-color: rgba(17,17,17,.45);
  }

  .dot{ color: rgba(95,99,104,.7); }

  .navCenter{
    justify-self:center;
    font-size:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }

  .copyright{
    justify-self:end;
    font-size:14px;
    color:var(--muted);
  }

  @media (max-width: 980px){
    .wrap{ padding:56px 28px 0; }
    .wrap--footer{ padding:14px 28px 48px; }
    h1{ font-size:38px; }

    footer{
      grid-template-columns: 1fr;
      justify-items:start;
      gap:10px;
    }
    .navCenter{ justify-self:start; }
    .copyright{ justify-self:start; }
  }

  @media (max-width: 520px){
    h1{ font-size:32px; }
    .lede{ font-size:17px; }
  }
</style>
</head>

<body>
  <main class="wrap">
    <a class="backLink" href="/">&larr; Tyler Borchers</a>
    <div class="pageHead">
      <h1>Contact</h1>
    </div>

    <p class="lede">Get in touch.</p>

    <!-- Replace this block with your real contact details / form -->
    <div class="placeholder">
      Contact details will go here. Remove this dashed box once you add real content.
    </div>
  </main>

  <div class="wrap wrap--footer">
    <footer>
      <div class="socialText">
        <a class="footerLink" href="https://www.linkedin.com/in/tylerborchers/" target="_blank" rel="noopener">LinkedIn</a>
        <span class="dot">·</span>
        <a class="footerLink" href="https://x.com/tylerborchers" target="_blank" rel="noopener">X</a>
        <span class="dot">·</span>
        <a class="footerLink" href="https://bsky.app/profile/tylerborchers.com" target="_blank" rel="noopener">Bluesky</a>
      </div>

      <nav class="navCenter" aria-label="Site pages">
        <a class="footerLink" href="/recognition/">Recognition</a>
        <span class="dot">·</span>
        <a class="footerLink" href="/contact/">Contact</a>
      </nav>

      <div class="copyright">&copy; 2026 Tyler Borchers</div>
    </footer>
  </div>
</body>
</html>
